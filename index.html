<style>
:root {
  --bg: #02040f;
  --panel: #0a0e1e;
  --panel-2: #101629;
  --line: rgba(255,255,255,.11);
  --white: #f8fafc;
  --muted: #99a5b8;
  --red: #dd524c;
  --red-hover: #e9655f;
  --font: "Archivo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); }
body {
  min-height: 100svh;
  color: var(--white);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 80% 20%, rgba(221,82,76,.14), transparent 31rem),
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: auto, 72px 72px, 72px 72px;
  mask-image: linear-gradient(to bottom, black, transparent 86%);
}

.page {
  position: relative;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: clamp(12px, 2.2vw, 24px);
}

.card {
  width: min(1120px, 100%);
  max-height: calc(100svh - clamp(24px, 4.4vw, 48px));
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.cover {
  display: block;
  width: 100%;
  height: min(30svh, 280px);
  object-fit: cover;
  object-position: center;
  border-radius: clamp(14px, 2vw, 24px);
}

.topline {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px clamp(22px, 4vw, 48px);
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .19em;
  text-transform: uppercase;
}
.topline::before {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 999px;
  background: var(--red);
  box-shadow: 0 0 18px rgba(221,82,76,.85);
}

.content {
  padding: clamp(18px, 2.4svh, 26px) clamp(12px, 2vw, 20px) 0;
}

.rename {
  display: flex;
  justify-content: center;
  align-items: center;
}

.brand {
  display: grid;
  place-items: center;
  padding: 0;
}

.mini-logo {
  display: block;
  width: min(100%, clamp(240px, 28vw, 360px));
  max-height: 16svh;
  height: auto;
}


.copy {
  max-width: 760px;
  margin: clamp(12px, 1.8svh, 18px) auto 0;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: clamp(24px, 3.2vw, 44px);
  line-height: 1.04;
  letter-spacing: -.04em;
  font-weight: 900;
}

.copy p {
  margin: 10px auto 0;
  max-width: 700px;
  color: var(--muted);
  font-size: clamp(15px, 1.25vw, 18px);
  line-height: 1.42;
}

.actions {
  display: flex;
  justify-content: center;
  margin-top: clamp(14px, 1.8svh, 18px);
}

.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: min(100%, 280px);
  padding: 15px 24px;
  border-radius: 12px;
  background: var(--red);
  color: white;
  font-size: 16px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: .02em;
  text-transform: uppercase;
  text-decoration: none;
  transition: transform .15s ease, background .15s ease;
}
.cta:hover { background: var(--red-hover); transform: translateY(-2px); }
.cta:active { transform: none; }
.cta:focus-visible { outline: 3px solid white; outline-offset: 4px; }

.footer-note {
  margin-top: 10px;
  color: #738096;
  font-size: 12px;
  text-align: center;
}

@media (max-width: 820px) {
  .page {
    place-items: start;
    padding: 12px;
  }
  .card {
    max-height: calc(100svh - 24px);
  }
  .cover {
    height: min(26svh, 220px);
    object-position: 42% center;
    border-radius: 16px;
  }
  .content {
    padding: 16px 10px 0;
  }
  .mini-logo {
    width: min(100%, 300px);
    max-height: 14svh;
  }
  .copy {
    margin-top: 12px;
  }
  h1 {
    font-size: clamp(22px, 4.4vw, 34px);
  }
  .copy p {
    font-size: 15px;
  }
}

@media (max-width: 480px) {
  .page {
    padding: 10px;
  }
  .card {
    max-height: calc(100svh - 20px);
  }
  .cover {
    height: min(23svh, 170px);
    border-radius: 14px;
  }
  .content {
    padding: 14px 6px 0;
  }
  .mini-logo {
    width: min(100%, 220px);
    max-height: 12svh;
  }
  .copy {
    margin-top: 10px;
  }
  h1 {
    font-size: clamp(22px, 7vw, 30px);
  }
  .copy p {
    margin-top: 8px;
    font-size: 14px;
    line-height: 1.38;
  }
  .actions {
    margin-top: 14px;
  }
  .cta {
    width: 100%;
    min-width: 0;
    padding: 14px 18px;
    font-size: 16px;
  }
  .footer-note {
    margin-top: 8px;
    font-size: 11px;
  }
}

@media (max-width: 360px) {
  .cover {
    height: min(21svh, 150px);
  }
  .mini-logo {
    width: min(100%, 200px);
  }
  h1 {
    font-size: 20px;
  }
  .copy p {
    font-size: 13px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .cta { transition: none; }
}
</style>
